name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install --requirement requirements.txt

      - name: Pruebas unitarias
        run: python -m unittest discover -s tests -v

      # Canario, no compuerta. Lo que de verdad tiene que estar bien es lo que
      # esta corrida ESCRIBE, y eso lo valida el paso "Corrida offline y validacion de su salida", donde sigue rompiendo
      # con exit 1.
      #
      # Aqui no puede romper, y la razon es un interbloqueo real: del 12 al 14
      # de septiembre de 2026 el cron cayo ocho veces seguidas. Lo primero que
      # fallo fueron dos tests (el commit anterior), pero al arreglarlos
      # aparecio el segundo candado. Sin corridas nadie commitea `data/`; sin
      # commit las notas envejecen dentro de la ventana; y entonces este paso
      # falla con
      #
      #   error: ventana: N nota(s) mas viejas que 30 dias siguen en la ventana
      #
      # o sea que se niega a arrancar POR la misma staleness que solo esa
      # corrida podia arreglar, porque el pipeline que archiva esas notas viene
      # despues y ya no se ejecuta.
      #
      # La antiguedad de `data/` no es un invariante del repo: es la salida de
      # la ultima corrida y decae con el reloj, por diseno. Medirla como
      # compuerta ANTES de correr convierte cualquier caida larga en una caida
      # permanente. Se sigue publicando en el log, que es para lo que sirve un
      # canario.
      - name: Validar config/ y data/ del repo
        continue-on-error: true
        run: python -m pulso validar

      # Corrida completa sin tocar la red, a una carpeta temporal: prueba el
      # pipeline de punta a punta sin ensuciar data/ ni depender de que los
      # feeds de BC esten arriba.
      - name: Corrida offline y validacion de su salida
        run: |
          python -m pulso correr --sin-red --salida "${RUNNER_TEMP}/data"
          python -m pulso comunicados --sin-red --salida "${RUNNER_TEMP}/data"
          python -m pulso validar --datos "${RUNNER_TEMP}/data"

      - name: Armar el sitio
        run: python -m pulso sitio --destino "${RUNNER_TEMP}/_site"

  # El tablero no estaba en CI, asi que ni los tipos ni las escalas de diseno
  # tenian quien los sostuviera entre commits.
  tablero:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # `package_json_file` es OBLIGATORIO aqui: `defaults.run.working-directory`
      # solo afecta a los pasos `run`, no a las entradas de una accion, asi que
      # sin esto action-setup busca packageManager en el package.json de la
      # RAIZ, que no existe, y el job muere en siete segundos con "No pnpm
      # version is specified". No se noto antes porque este es el primer PR del
      # repo: el job se agrego y nunca corrio.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Aqui es donde mapa-delegaciones.tsx se defiende solo: su Record sobre
      # la union de delegaciones es exhaustivo, asi que agregar una decima sin
      # su poligono rompe el build en ese archivo y no en produccion.
      - name: Tipos
        run: pnpm tipos

      - name: Contrato de garitas offline
        run: node scripts/probar-garitas.cjs

      # Lo mismo para la busqueda en vivo y /api/actualidad: parseo del RSS de
      # Google, fusion de locales y la politica de cache del route handler.
      - name: Contrato de búsqueda offline
        run: node scripts/probar-busqueda.cjs

      # La mitad duradera del barrido de diseno. El navegador probo aquel
      # barrido; esto prueba todos los commits que vienen.
      - name: Escalas de diseno
        run: pnpm tokens

      - name: Build
        run: pnpm build
