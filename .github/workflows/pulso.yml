name: Pulso — ingesta y despliegue

# Un solo workflow es dueno del commit de datos Y del despliegue, a proposito.
#
# Los commits hechos con GITHUB_TOKEN NO disparan `on: push`. Un workflow
# aparte de "desplegar al hacer push" nunca se ejecutaria despues del commit
# del cron: la pagina se quedaria congelada mientras data/ avanza. La otra
# cara de la moneda es util: el commit del bot no puede volver a disparar
# este workflow, asi que no hay ciclo.

on:
  workflow_dispatch:
    inputs:
      sin_red:
        description: "Correr sin red (usa tests/fixtures/corpus.json)"
        type: boolean
        default: false
      forzar_indicadores:
        description: "Volver a bajar vivienda, crimen y percepción aunque estén frescos"
        type: boolean
        default: false
      descubrimiento_web:
        description: "Descubrir publishers recientes con GDELT"
        type: boolean
        default: false
      actualizar_gasto_electoral:
        description: "Actualizar dictámenes 2024 y financiamiento electoral"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  # Minuto 17 y no 0 porque a la hora en punto GitHub encola miles de crons.
  schedule:
    - cron: "17 */6 * * *"
    # Los dictamenes son finales y el financiamiento anual: una vez por semana,
    # sin convertir expedientes enormes en una descarga de cada seis horas.
    - cron: "41 18 * * 1"

permissions:
  contents: read

concurrency:
  group: pulso-main
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"

jobs:
  ingesta:
    name: Pruebas, pipeline y commit de data/
    runs-on: ubuntu-latest
    # El modelo de sentimiento agrega unos minutos la primera vez (torch CPU
    # y ~430 MB de pesos); con los dos caches de abajo, despues es rapido.
    # Dos actores sincronicos mas (TikTok) pueden sumar ~10 min al peor caso.
    timeout-minutes: 35
    permissions:
      contents: write
    outputs:
      cambios: ${{ steps.commit.outputs.cambios }}
    steps:
      - uses: actions/checkout@v4
        with:
          # La punta de main, no github.sha: si una corrida quedo encolada
          # mientras otra empujo, el push de esta seria non-fast-forward.
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-modelo.txt

      - name: Instalar dependencias
        run: python -m pip install --requirement requirements.txt

      # El clasificador local de tono y sentimiento (pulso/sentimiento.py).
      # Torch va del indice CPU: la rueda CUDA pesa ~800 MB y aqui no hay GPU.
      - name: Instalar el modelo de sentimiento
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --requirement requirements-modelo.txt

      # Los pesos del modelo (~430 MB) se bajan de Hugging Face en la primera
      # prediccion. Sin este cache, cada corrida del cron los volveria a bajar.
      - name: Cache del modelo de sentimiento
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: modelo-robertuito-sentiment-analysis-v1

      - name: Pruebas
        run: python -m unittest discover -s tests -v

      # Canario, no compuerta. Lo que de verdad tiene que estar bien es lo que
      # esta corrida ESCRIBE, y eso lo valida el paso "Validar lo que acaba de escribir", donde sigue rompiendo
      # con exit 1.
      #
      # Aqui no puede romper, y la razon es un interbloqueo real: del 12 al 14
      # de septiembre de 2026 el cron cayo ocho veces seguidas. Lo primero que
      # fallo fueron dos tests (el commit anterior), pero al arreglarlos
      # aparecio el segundo candado. Sin corridas nadie commitea `data/`; sin
      # commit las notas envejecen dentro de la ventana; y entonces este paso
      # falla con
      #
      #   error: ventana: N nota(s) mas viejas que 30 dias siguen en la ventana
      #
      # o sea que se niega a arrancar POR la misma staleness que solo esa
      # corrida podia arreglar, porque el pipeline que archiva esas notas viene
      # despues y ya no se ejecuta.
      #
      # La antiguedad de `data/` no es un invariante del repo: es la salida de
      # la ultima corrida y decae con el reloj, por diseno. Medirla como
      # compuerta ANTES de correr convierte cualquier caida larga en una caida
      # permanente. Se sigue publicando en el log, que es para lo que sirve un
      # canario.
      - name: Validar lo que hay en el repo
        continue-on-error: true
        run: python -m pulso validar

      # --metodo modelo: tono de cada titular con el modelo local. Es tono de
      # la frase, no postura hacia una persona; el tablero lo rotula asi.
      - name: Pipeline
        run: python -m pulso correr --metodo modelo ${{ (github.event_name == 'schedule' || inputs.descubrimiento_web) && '--descubrimiento-web' || '' }} ${{ inputs.sin_red && '--sin-red' || '' }}

      - name: Comunicados del Ayuntamiento de Tecate
        run: python -m pulso comunicados ${{ inputs.sin_red && '--sin-red' || '' }}

      # El cache de comentarios NO puede ir a git (retencion de 30 dias, ver
      # pulso/youtube.py), pero sin persistirlo entre corridas la ventana de
      # 30 dias no existiria: cada corrida derivaria solo de si misma.
      # actions/cache resuelve las dos cosas: no es git, caduca solo, y es
      # privado del repo.
      - name: Restaurar el cache de comentarios
        if: vars.YOUTUBE_HABILITADO == 'true'
        uses: actions/cache@v4
        with:
          path: cache
          key: comentarios-${{ github.run_id }}
          restore-keys: comentarios-

      # --sentimiento modelo etiqueta cada comentario EN EL CACHE (que vive 30
      # dias y no entra a git); a data/ solo llegan conteos por zona y tema.
      - name: Conversación (YouTube)
        if: vars.YOUTUBE_HABILITADO == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m pulso conversacion --sentimiento modelo

      # Apify (redes sociales). Este paso verifica el token y el catalogo
      # antes de que Instagram, TikTok y X, mas abajo, gasten credito: un token
      # caducado falla con 401 a media cosecha, seis horas despues y sin
      # nadie mirando. Aqui falla en el paso que lleva su nombre. Es una
      # llamada, sin costo. El catalogo trae los actores en `activo: false`
      # a proposito: no es el interruptor (cada modulo fija su actor), es el
      # registro que la guardia de sesion revisa (pulso/apify.py, docs/PLAN.md
      # seccion 3).
      - name: Apify — token y catálogo
        if: vars.APIFY_HABILITADO == 'true'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m pulso apify --verificar

      # cache/instagram guarda dos cosas que NO pueden ir a git: el texto
      # crudo (30 dias, LFPDPPP y CPRA) y vistos.json, el registro de posts
      # ya cosechados. Sin persistir el segundo, el freno de costo no existe:
      # cada corrida volveria a pagarle a Apify por los comentarios de los
      # mismos posts, y el deduplicado del cache lo escondería -- los conteos
      # saldrian bien y la factura saldria mal.
      - name: Restaurar el cache de Instagram
        if: vars.APIFY_HABILITADO == 'true'
        uses: actions/cache@v4
        with:
          path: cache/instagram
          key: instagram-${{ github.run_id }}
          restore-keys: instagram-

      # Solo cosecha las cuentas con "verificado": true en
      # config/instagram.json (diez sondeadas el 8 de septiembre de 2026 y
      # tres el 10, pedidas por el cliente; ventana de 24 horas desde ese dia).
      # Ver el aviso en ese archivo: un handle derivado del nombre del medio
      # da una cuenta ajena o vacia, y las dos se cobran igual.
      #
      # Escribe dos cosas, las dos en data/: redes.json (conteos y posts
      # destacados, va a git) y redes-comentarios.json (el TEXTO de los
      # comentarios, que NO va a git: .gitignore lo excluye por nombre con
      # data/*-comentarios.json, asi que el `git add data/` de mas abajo no lo
      # toca). El segundo sale del cache restaurado arriba y llega al sitio
      # con el resto de data/. Hasta el 17 de septiembre de 2026 vivia en
      # efimero/, una carpeta aparte.
      - name: Redes (Instagram)
        if: vars.APIFY_HABILITADO == 'true'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m pulso redes --sentimiento modelo

      # cache/tiktok: mismo papel que cache/instagram (texto crudo 30 dias +
      # vistos.json, el freno de costo). El actor de comentarios de TikTok
      # cobra diez veces el de videos, asi que aqui el freno pesa mas.
      - name: Restaurar el cache de TikTok
        if: vars.APIFY_HABILITADO == 'true'
        uses: actions/cache@v4
        with:
          path: cache/tiktok
          key: tiktok-${{ github.run_id }}
          restore-keys: tiktok-

      # BUSQUEDAS (ultimas 24 horas), no cuentas: la zona de cada video sale
      # de su pie con el gacetero, y el @ del creador si se publica (decision
      # del cliente, 8 sep 2026). Empezo con una sola, "tijuana noticias";
      # desde el 15 de septiembre de 2026 son once filas, ocho encendidas, y
      # el `ambito` de cada una decide su residuo. Escribe data/tiktok.json
      # (git) y data/tiktok-comentarios.json (fuera de git por la regla de
      # .gitignore; viaja al sitio con el resto de data/).
      - name: TikTok (búsqueda)
        if: vars.APIFY_HABILITADO == 'true'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m pulso tiktok --sentimiento modelo

      # X entra SOLO por tendencias (peticion del cliente, 11 sep 2026): el
      # actor lee el endpoint de tendencias con un guest token, sin cuenta ni
      # cookies, y una llamada cubre Tijuana, Mexicali, San Diego, Mexico y
      # el mundo. Escribe data/tendencias.json: nombre, puesto y liga de cada
      # tendencia, nunca un tuit ni quien lo escribio. Sin cache: no hay texto
      # personal que retener ni comentarios que deduplicar.
      - name: Tendencias (X)
        if: vars.APIFY_HABILITADO == 'true'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m pulso tendencias

      # Vivienda, suelo, crimen y percepcion. Se salta solo si lo que hay
      # tiene menos de una semana: son fuentes trimestrales y mensuales, y
      # bajar 60 MB cada hora seria una groseria sin dato nuevo a cambio.
      - name: Indicadores oficiales
        run: python -m pulso indicadores ${{ inputs.forzar_indicadores && '--forzar' || '' }}

      # Une CSV abiertos y anexos finales por ID de contabilidad. Los ZIP del
      # INE se leen por HTTP Range: solo directorio central y Anexo II. Nunca
      # se usa el nombre para unir ni se publica una fila sin conciliacion.
      - name: Gasto electoral y financiamiento partidista
        if: github.event.schedule == '41 18 * * 1' || inputs.actualizar_gasto_electoral
        run: python -m pulso gasto-electoral

      - name: Validar lo que acaba de escribir
        run: python -m pulso validar

      - name: Commit de data/ si cambio
        id: commit
        run: |
          git config user.name "pulso-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/*-comentarios.json NO entra aqui: lo excluye .gitignore, y
          # esa linea es lo unico que separa el texto de los comentarios de
          # un historial que no puede cumplir la retencion de 30 dias. Si
          # alguna vez aparece un *-comentarios.json en un commit, esa linea
          # es lo primero que hay que mirar; `pulso validar` falla antes de
          # llegar aqui si falta (pulso/validador.py::_regla_gitignore).
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en data/"
            echo "cambios=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "datos: ingesta $(date -u +'%Y-%m-%d %H:%MZ') [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "cambios=true" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------ el tablero

      # A partir de aqui lo que se publica es web/ (Next.js), no sitio/. El
      # tablero plano sigue en el repo y en CI, pero ya no es el producto.
      #
      # SE DESPLIEGA DESDE EL RUNNER, no desde un build del host contra git, y
      # esa no es una preferencia de herramienta: es la unica forma de que el
      # TEXTO de los comentarios llegue a la pagina. Esta en data/ pero fuera
      # de git por la retencion de 30 dias (ver .gitignore), asi que un host
      # que construya desde el repositorio nunca lo veria y publicaria los
      # posts sin comentarios. Aqui, en cambio, los acaba de escribir el paso
      # de redes de esta misma corrida.
      #
      # `pnpm build` corre scripts/sincronizar-datos.mjs, que copia data/
      # entero a web/public/data, esos dos archivos incluidos.
      #
      # El tablero necesita un host con Node: next.config.ts deja `output` sin
      # definir a proposito para conservar las route handlers, y /api/garitas
      # existe porque CBP no manda cabeceras CORS. No es exportacion estatica,
      # y por eso Pages ya no sirve para esto.
      - name: Instalar el tablero
        if: vars.DESPLEGAR_TABLERO == 'true'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Node
        if: vars.DESPLEGAR_TABLERO == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Dependencias del tablero
        if: vars.DESPLEGAR_TABLERO == 'true'
        working-directory: web
        run: pnpm install --frozen-lockfile

      # Construye contra el entorno del host para que las variables de
      # produccion (NEXT_PUBLIC_*) sean las mismas que en el despliegue.
      - name: Construir y desplegar el tablero
        if: vars.DESPLEGAR_TABLERO == 'true'
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"
          pnpm dlx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
